AWSTemplateFormatVersion: '2010-09-09'
Description: Master stack that orchestrates all nested stacks for AWS Sensei Spotify CI/CD

Resources:

  # --------------------------
  # Foundation Layer
  # --------------------------
  FoundationRoles:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: foundation/roles.yaml
      Tags:
        - Key: Project
          Value: aws-sensei
        - Key: Service
          Value: spotify
        - Key: Component
          Value: cicd

  FoundationArtifacts:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: foundation/artifacts.yaml
      Tags:
        - Key: Project
          Value: aws-sensei
        - Key: Service
          Value: spotify
        - Key: Component
          Value: cicd

  # --------------------------
  # Build Layer
  # --------------------------
  PackageBuildProject:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: build/codebuild.yaml
      Parameters:
        CodeBuildRoleArn: !GetAtt FoundationRoles.Outputs.CodeBuildRoleArn
      Tags:
        - Key: Project
          Value: aws-sensei
        - Key: Service
          Value: spotify
        - Key: Component
          Value: cicd

  # --------------------------
  # Pipeline Layer
  # --------------------------
  CICDPipeline:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: pipeline/pipeline.yaml
      Parameters:
        CodePipelineRoleArn: !GetAtt FoundationRoles.Outputs.CodePipelineRoleArn
        CloudFormationExecutionRoleArn: !GetAtt FoundationRoles.Outputs.CloudFormationExecutionRoleArn
        ArtifactBucketName: !GetAtt FoundationArtifacts.Outputs.ArtifactBucketName
        PackageBuildProjectName: !GetAtt PackageBuildProject.Outputs.PackageBuildProjectName
      Tags:
        - Key: Project
          Value: aws-sensei
        - Key: Service
          Value: spotify
        - Key: Component
          Value: cicd