AWSTemplateFormatVersion: '2010-09-09'
Description: CodeBuild project for building and deploying the AWS Sensei (GoHugo Framework) Blog

Parameters:
  CodeBuildRoleArn:
    Type: String
    Description: ARN of the IAM Role used by CodeBuild

Resources:
  
  HugoBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: HugoBuild
      ServiceRole: !Ref CodeBuildRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: WEBSITE_BUCKET
            Type: PARAMETER_STORE
            Value: /aws-sensei/blog/bucket-name
          - Name: CLOUDFRONT_DISTRIBUTION_ID
            Type: PARAMETER_STORE
            Value: /aws-sensei/blog/cloudfront-distribution-id
      Source:
        Type: CODEPIPELINE
        BuildSpec: frontend/buildspec.yml
      TimeoutInMinutes: 20  
              
Outputs:
  HugoBuildProjectName:
    Description: Name of the CodeBuild project
    Value: !Ref HugoBuildProject
