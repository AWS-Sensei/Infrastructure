AWSTemplateFormatVersion: '2010-09-09'
Description: CodeBuild project for SAM deployments of AWS Sensei APIs

Parameters:
  CodeBuildRoleArn:
    Type: String
    Description: ARN of the IAM Role used by CodeBuild

  CloudFormationExecutionRoleArn:
    Type: String
    Description: ARN passed to SAM deploy as --role-arn

  ArtifactBucketName:
    Type: String
    Description: S3 bucket used for SAM Lambda package uploads

Resources:

  SamBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: SamApisDeploy
      ServiceRole: !Ref CodeBuildRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: CLOUDFORMATION_EXECUTION_ROLE_ARN
            Value: !Ref CloudFormationExecutionRoleArn
          - Name: SAM_ARTIFACT_BUCKET
            Value: !Ref ArtifactBucketName
      Source:
        Type: CODEPIPELINE
        BuildSpec: apis/buildspec.yml
      TimeoutInMinutes: 30

Outputs:
  SamBuildProjectName:
    Description: Name of the SAM CodeBuild project
    Value: !Ref SamBuildProject
