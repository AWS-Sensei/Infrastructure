AWSTemplateFormatVersion: '2010-09-09'
Description: Master stack that orchestrates all nested stacks for AWS Sensei Blog CI/CD

Resources:

  # --------------------------
  # Foundation Layer
  # --------------------------
  FoundationRoles:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: foundation/roles.yaml

  FoundationArtifacts:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: foundation/artifacts.yaml

  # --------------------------
  # Build Layer
  # --------------------------
  HugoBuildProject:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: build/codebuild.yaml
      Parameters:
        CodeBuildRoleArn: !GetAtt FoundationRoles.Outputs.CodeBuildRoleArn

  SamBuildProject:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: build/sam-codebuild.yaml
      Parameters:
        CodeBuildRoleArn: !GetAtt FoundationRoles.Outputs.CodeBuildRoleArn
        CloudFormationExecutionRoleArn: !GetAtt FoundationRoles.Outputs.CloudFormationExecutionRoleArn
        ArtifactBucketName: !GetAtt FoundationArtifacts.Outputs.ArtifactBucketName

  # --------------------------
  # Pipeline Layer
  # --------------------------
  FrontendPipeline:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - HugoBuildProject
    Properties:
      TemplateURL: pipeline/pipeline.yaml
      Parameters:
        CodePipelineRoleArn: !GetAtt FoundationRoles.Outputs.CodePipelineRoleArn
        ArtifactBucketName: !GetAtt FoundationArtifacts.Outputs.ArtifactBucketName
        HugoBuildProjectName: !GetAtt HugoBuildProject.Outputs.HugoBuildProjectName

  InfraPipeline:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: pipeline/infra-pipeline.yaml
      Parameters:
        CodePipelineRoleArn: !GetAtt FoundationRoles.Outputs.CodePipelineRoleArn
        CloudFormationExecutionRoleArn: !GetAtt FoundationRoles.Outputs.CloudFormationExecutionRoleArn
        ArtifactBucketName: !GetAtt FoundationArtifacts.Outputs.ArtifactBucketName

  ApisPipeline:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - SamBuildProject
    Properties:
      TemplateURL: pipeline/apis-pipeline.yaml
      Parameters:
        CodePipelineRoleArn: !GetAtt FoundationRoles.Outputs.CodePipelineRoleArn
        ArtifactBucketName: !GetAtt FoundationArtifacts.Outputs.ArtifactBucketName
        SamBuildProjectName: !GetAtt SamBuildProject.Outputs.SamBuildProjectName
